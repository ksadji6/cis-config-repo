project_service.port=8082

# Base de données MySQL
project_service.datasource-url=jdbc:mysql://localhost:3307/cis_project_db?createDatabaseIfNotExist=true
project_service.username=root
project_service.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
project_service.hibernate-ddl-auto=update
project_service.show-sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# MongoDB (Connexion locale)
project_service.mongodb-uri=mongodb://localhost:27017/cis_documents_db

# Eureka 
project_service.urlregistry=http://localhost:8761/eureka/

# MAIL (Tu peux réutiliser les mêmes paramètres que Identity)
project_service.mail-host=smtp.gmail.com
project_service.mail-port=587