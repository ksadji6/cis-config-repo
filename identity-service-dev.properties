identity-service.port=8081
identity-service.datasource-url=jdbc:mysql://localhost:3307/cis_identity_db?createDatabaseIfNotExist=true
identity-service.username=root
identity-service.password=

identity-service.hibernate-ddl-auto=update
identity-service.show-sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

identity-service.jwt-secret=CIS_Integration_2026_Secure_Key_For_Identity_Service_ESMT_Dakar_Senegal
identity-service.jwt-expiration=86400000

identity-service.urlregistry=http://localhost:8761/eureka/