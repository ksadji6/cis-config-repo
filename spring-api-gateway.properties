gateway.port=8090
gateway.identity-path=/api/auth/**, /api/users/**, /v3/api-docs/**, /swagger-ui/**
gateway.project-path=/api/projects/**,/api/tasks/**,/api/statistiques/**, /v3/api-docs/**, /swagger-ui/**
gateway.urlregistry=http://localhost:8761/eureka/

gateway.identity-path=/api/auth/**, /api/users/**, /identity-service/v3/api-docs
gateway.project-path=/api/projects/**, /api/tasks/**, /api/statistiques/**, /project-service/v3/api-docs

# 1. On active le support natif de la Gateway
springdoc.enable-native-support=true
springdoc.swagger-ui.path=/swagger-ui.html

# 2. On configure la découverte automatique via Eureka
springdoc.gateway.discovery.locator.enabled=true

# 💡 LA LIGNE CORRECTRICE : Explique à la Gateway comment construire l'URL de doc de chaque service
# Elle va transformer "project-service" en "/project-service/v3/api-docs" tout seule !
springdoc.gateway.discovery.locator.url-expression='/' + serviceId + '/v3/api-docs'